name: Canary Release

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Branch, tag or commit SHA to build"
        required: true
        default: "canary_10_19"
      release_tag:
        description: "Release tag (defaults to canary-<run number>)"
        required: false
        default: ""

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  RELEASE_TAG: ${{ inputs.release_tag || format('canary-{0}', github.run_number) }}
  # Fallback changelog base when no earlier canary tag exists.
  UPSTREAM_URL: https://github.com/themrdemonized/xray-monolith
  UPSTREAM_BRANCH: all-in-one-vs2022-wpo-mt

permissions:
  contents: write

jobs:
  # Resolve build_ref to one commit up front, so every build job and the release
  # tag all point at the same SHA even if the branch moves during the run.
  resolve:
    name: resolve-ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short_sha: ${{ steps.sha.outputs.short_sha }}

    steps:
    - name: Checkout ${{ inputs.build_ref }}
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.build_ref }}

    - name: Resolve SHA
      id: sha
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        # Same length as the "* Build:" line (build_identity.ps1)
        echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build-job
    needs: resolve
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX10", "DX10-AVX", "DX11", "DX11-AVX"]

    env:
      # Read by src/xrCore/build_identity.ps1
      CANARY_NUMBER: ${{ github.run_number }}
      XR_BUILD_BRANCH: ${{ inputs.build_ref }}

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout ${{ needs.resolve.outputs.sha }}
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve.outputs.sha }}

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    # Ship whatever the build put in bin_dbg. The scheduler needs tbb12.dll only;
    # the tbbmalloc allocator and the legacy tbb.dll must never ship.
    - name: Collect binaries
      run: |
        $bin = "./_build/_game/bin_dbg"
        $banned = Get-ChildItem -Path $bin -File | Where-Object { $_.Name -like "tbbmalloc*.dll" -or $_.Name -eq "tbb.dll" }
        if ($banned) { throw "Banned TBB DLLs in build output: $($banned.Name -join ', ')" }
        New-Item -ItemType Directory -Force -Path ./stage/bin, ./stage/pdb | Out-Null
        $bins = Get-ChildItem -Path $bin -File | Where-Object { $_.Extension -in ".exe", ".dll" }
        $pdbs = Get-ChildItem -Path $bin -File -Filter *.pdb
        if (-not ($bins | Where-Object Extension -eq ".exe")) { throw "No .exe in $bin" }
        if (-not $pdbs) { throw "No .pdb in $bin" }
        $bins | Copy-Item -Destination ./stage/bin
        $pdbs | Copy-Item -Destination ./stage/pdb
        Get-ChildItem -Recurse ./stage | Select-Object FullName, Length

    - name: Upload binaries
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_canary_bin
        path: ./stage/bin/
        if-no-files-found: "error"
        retention-days: 90

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_canary_pdb
        path: ./stage/pdb/
        if-no-files-found: "error"
        retention-days: 90

  # Engine support data and the MO2 shader mod, built from the same SHA as the
  # executables. The db0 replaces Modded Exes' 00_modded_exes_gamedata.db0, so
  # users don't need a Modded Exes install first. The shader mod is built only
  # when the ref has packaging/shader-files.txt.
  package-data:
    name: package-data-job
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout ${{ needs.resolve.outputs.sha }}
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve.outputs.sha }}

    - name: Pack gamedata into db archives
      run: |
        $ErrorActionPreference = 'Stop'
        $compressor = Join-Path $PWD 'stage/compressor'
        # Tracked gamedata only, without dotfiles (.vscode and the like).
        $files = @(git -c core.quotepath=false ls-files -- gamedata | Where-Object { $_ -notmatch '(^|/)\.' })
        if ($LASTEXITCODE -ne 0 -or !$files.Count) { throw 'Cannot enumerate tracked gamedata' }
        foreach ($f in $files) {
          $dest = Join-Path $compressor $f
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
          Copy-Item -LiteralPath $f -Destination $dest
        }
        foreach ($name in 'xrCompress.exe', 'xrCore.dll', 'build_patch.ltx') {
          Copy-Item -LiteralPath "compressor/$name" -Destination $compressor
        }
        Write-Host "Packing $($files.Count) gamedata files"
        $p = Start-Process -FilePath (Join-Path $compressor 'xrCompress.exe') `
          -ArgumentList @('gamedata', '-ltx', 'build_patch.ltx', '-pack', '-strong', '-1024', '-db') `
          -WorkingDirectory $compressor -NoNewWindow -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "xrCompress failed with exit code $($p.ExitCode)" }
        $archives = @(Get-ChildItem -LiteralPath $compressor -File | Where-Object Name -match '^gamedata\.db[0-9]+$')
        if (!$archives -or (Get-Item (Join-Path $compressor 'gamedata.db0')).Length -eq 0) {
          throw 'xrCompress did not produce gamedata.db0'
        }
        $mods = New-Item -ItemType Directory -Force -Path ./stage/data/db/mods
        foreach ($a in $archives) {
          # Upstream's name, so extracting replaces a Modded Exes install's archive.
          $null = $a.Name -match '^gamedata\.db([0-9]+)$'
          Copy-Item -LiteralPath $a.FullName -Destination (Join-Path $mods "00_modded_exes_gamedata.db$($Matches[1])")
        }
        Get-ChildItem -Recurse ./stage/data | Select-Object FullName, Length

    - name: Build MO2 shader mod
      id: shaders
      run: |
        $ErrorActionPreference = 'Stop'
        $manifest = 'packaging/shader-files.txt'
        if (!(Test-Path -LiteralPath $manifest)) {
          Write-Host "No $manifest at this ref, skipping the shader mod"
          exit 0
        }
        $entries = @(Get-Content -LiteralPath $manifest | ForEach-Object { $_.Trim().Replace('\', '/') } |
          Where-Object { $_ -and !$_.StartsWith('#') })
        if (!$entries.Count) { throw "$manifest lists no files" }
        $root = Join-Path $PWD 'stage/shaders'
        foreach ($rel in $entries) {
          if (!$rel.StartsWith('gamedata/')) { throw "Shader manifest entry outside gamedata: $rel" }
          if (!(Test-Path -LiteralPath $rel -PathType Leaf)) { throw "Shader manifest entry missing: $rel" }
          $dest = Join-Path $root $rel
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
          Copy-Item -LiteralPath $rel -Destination $dest
        }
        # Zip root holds gamedata/, which is the layout MO2 installs directly.
        New-Item -ItemType Directory -Force -Path ./stage/shaders-zip | Out-Null
        Compress-Archive -Path (Join-Path $root 'gamedata') -DestinationPath ./stage/shaders-zip/shaders_mo2.zip
        "built=true" >> $env:GITHUB_OUTPUT

    - name: Upload db archives
      uses: actions/upload-artifact@v4.6.0
      with:
        name: canary_data_db
        path: ./stage/data/
        if-no-files-found: "error"
        retention-days: 90

    - name: Upload shader mod
      if: steps.shaders.outputs.built == 'true'
      uses: actions/upload-artifact@v4.6.0
      with:
        name: canary_data_shaders
        path: ./stage/shaders-zip/shaders_mo2.zip
        if-no-files-found: "error"
        retention-days: 90

  release:
    name: release-job
    needs: [resolve, build, package-data]
    runs-on: ubuntu-latest

    steps:
    # Full history and tags, for the changelog.
    - name: Checkout ${{ needs.resolve.outputs.sha }}
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve.outputs.sha }}
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "*_canary_*"
        path: ./artifacts

    - name: Download data artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "canary_data_*"
        path: ./artifacts

    # Merge all configurations into one game zip (bin/ and db/mods/, extracted
    # over the Anomaly folder) and one PDB zip. Files shared by several builds
    # (tbb12.dll) must be identical. The MO2 shader mod ships as its own zip.
    - name: Package release assets
      run: |
        set -euo pipefail
        merge() {
          local kind=$1 dest=$2
          mkdir -p "$dest"
          for f in ./artifacts/*_canary_"$kind"/*; do
            name=$(basename "$f")
            if [ -e "$dest/$name" ]; then
              cmp -s "$f" "$dest/$name" || { echo "::error::$name differs between configurations"; exit 1; }
            else
              cp "$f" "$dest/"
            fi
          done
        }
        merge bin ./stage/bin
        merge pdb ./stage/pdb
        banned=$(find ./stage/bin -maxdepth 1 -type f \( -iname 'tbbmalloc*.dll' -o -iname 'tbb.dll' \) -printf '%f\n')
        if [ -n "$banned" ]; then
          echo "::error::Banned TBB DLLs in release assets: $banned"; exit 1
        fi
        [ -f ./stage/bin/tbb12.dll ] || { echo "::error::tbb12.dll missing from release binaries"; exit 1; }
        mkdir -p ./stage/game/bin ./release-assets
        cp ./stage/bin/* ./stage/game/bin/
        cp -r ./artifacts/canary_data_db/db ./stage/game/
        [ -f ./stage/game/db/mods/00_modded_exes_gamedata.db0 ] || { echo "::error::db0 missing"; exit 1; }
        (cd ./stage/game && zip -9 -r "../../release-assets/${RELEASE_TAG}_game.zip" bin db)
        (cd ./stage/pdb && zip -9 "../../release-assets/${RELEASE_TAG}_pdb.zip" *)
        if [ -f ./artifacts/canary_data_shaders/shaders_mo2.zip ]; then
          cp ./artifacts/canary_data_shaders/shaders_mo2.zip "./release-assets/${RELEASE_TAG}_shaders_mo2.zip"
        fi
        for z in ./release-assets/*.zip; do echo "$z:"; unzip -Z1 "$z" | sed 's/^/  /'; done

    - name: Generate release notes
      env:
        BUILD_REF: ${{ inputs.build_ref }}
        SHA: ${{ needs.resolve.outputs.sha }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail

        # CANARY.md section whose "## " heading is exactly build_ref, up to the
        # next "## " heading. Includes its "### Release notes" subsection.
        if [ ! -f CANARY.md ]; then
          echo "::error::CANARY.md not found at $SHA"; exit 1
        fi
        awk -v h="## $BUILD_REF" '
          { sub(/\r$/, "") }
          $0 == h { found = 1; print; next }
          found && /^## / { exit }
          found { print }
        ' CANARY.md > section.md
        if [ ! -s section.md ]; then
          echo "::error::CANARY.md at $SHA has no section with heading \"## $BUILD_REF\". Add one before releasing."
          exit 1
        fi

        # Changelog base: the merge base with upstream. Each canary is rebuilt
        # from upstream, so this lists exactly what the canary adds.
        git fetch --no-tags "$UPSTREAM_URL" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
        base=$(git merge-base "refs/remotes/upstream/$UPSTREAM_BRANCH" "$SHA") || {
          echo "::error::No merge base with upstream $UPSTREAM_BRANCH"; exit 1
        }
        base_desc="upstream \`$UPSTREAM_BRANCH\` merge base \`$(git rev-parse --short=7 "$base")\`"

        {
          cat section.md
          echo
          echo "## Changelog"
          echo
          echo "Commits since $base_desc:"
          echo
          git log --oneline --no-decorate "$base..$SHA" | sed 's/^/- /'
        } > release-notes.md
        cat release-notes.md

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ needs.resolve.outputs.sha }}
        name: Canary ${{ github.run_number }} (${{ inputs.build_ref }} @ ${{ needs.resolve.outputs.short_sha }})
        body_path: release-notes.md
        prerelease: true
        fail_on_unmatched_files: true
        # Game and PDB zips always, the shader mod zip when the ref has one.
        files: release-assets/*.zip
