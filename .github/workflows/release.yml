name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Branch, tag, or SHA to build"
        required: true
      release_tag:
        description: "Release tag (leave blank to auto-generate from build_ref)"
        required: false
        default: ""

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

permissions:
  contents: write

jobs:
  build:
    name: build-job
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX11", "DX11-AVX"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.build_ref }}

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload binaries
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_binaries
        path: |
          ./_build/_game/bin_dbg/*.exe
          ./_build/_game/bin_dbg/tbb12.dll
          ./_build/_game/bin_dbg/tbbmalloc.dll
          ./_build/_game/bin_dbg/tbbmalloc_proxy.dll
        if-no-files-found: "error"
        retention-days: 90

    - name: Upload PDBs
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_pdb
        path: ./_build/_game/bin_dbg/*.pdb
        if-no-files-found: "error"
        retention-days: 90

  release:
    name: release-job
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        pattern: "*_binaries"
        path: ./release-assets/bin
        merge-multiple: true

    - name: Download PDBs
      uses: actions/download-artifact@v4
      with:
        pattern: "*_pdb"
        path: ./release-assets/pdb
        merge-multiple: true

    - name: Determine tag
      id: tag
      run: |
        SAFE_REF=$(echo "${{ inputs.build_ref }}" | tr '/' '-')
        if [ -n "${{ inputs.release_tag }}" ]; then
          echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=tbb-test-${SAFE_REF}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Zip combined binaries
      run: |
        cd release-assets/bin
        zip -r ../tbb_test_binaries.zip .

    - name: Zip combined PDBs
      run: |
        cd release-assets/pdb
        zip -r ../tbb_test_pdb.zip .

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "TBB test build ${{ steps.tag.outputs.tag }} (${{ inputs.build_ref }})"
        prerelease: true
        files: |
          ./release-assets/tbb_test_binaries.zip
          ./release-assets/tbb_test_pdb.zip
